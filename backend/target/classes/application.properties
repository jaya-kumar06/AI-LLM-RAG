# ============================================
# RAG Chatbot - Application Configuration
# ============================================

server.port=8080

# ============================================
# PostgreSQL + pgvector (Docker)
# ============================================
pgvector.host=localhost
pgvector.port=5433
pgvector.database=ragchatbot
pgvector.user=postgres
pgvector.password=postgres
pgvector.table=document_embeddings

# JPA/Hibernate (for other entities if needed)
spring.datasource.url=jdbc:postgresql://localhost:5433/ragchatbot
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ============================================
# LLM Configuration
# ============================================
# Using Ollama (Local LLM - FREE)
# Install: https://ollama.ai then run: ollama pull mistral

llm.provider=ollama
ollama.base.url=http://localhost:11434
ollama.model=mistral

# To use OpenAI instead, uncomment:
# llm.provider=openai
# openai.api.key=sk-your-key-here
# openai.model=gpt-4o-mini

# ============================================
# RAG Settings
# ============================================
rag.chunk.size=500
rag.chunk.overlap=50
rag.max.results=3
rag.fetch.k=10
rag.lambda.mult=0.7

# ============================================
# JWT Security
# ============================================
jwt.secret=MySecretKeyForJWTTokenGeneration256BitsLongEnough123456789
jwt.expiration=86400000

# File Upload
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
upload.directory=E:/RESUME/java-rag-chatbot/uploads

# CORS
cors.allowed.origins=http://localhost:3000,http://localhost:5173

# Logging
logging.level.com.example.ragchatbot=DEBUG
logging.level.dev.langchain4j=INFO
